<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="画像比較">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="app-version" content="2026.10.05.8">
<title>画像比較</title>

<style>
:root{
  --safe-t:env(safe-area-inset-top,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --bg:#000;
  --panel:#121214;
  --panel2:#222226;
  --line:rgba(255,255,255,.12);
  --text:#fff;
  --muted:rgba(255,255,255,.62);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;
  overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  overscroll-behavior:none;
}
button,input{font:inherit}
button{color:inherit}
#app{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  background:#000;
  overflow:hidden;
}

/* 上部には操作UIを置かない */
#appbar{display:none!important}

/* 画像表示域は残り全部。操作UIは一切重ならない */
#stage{
  position:relative;
  flex:1 1 auto;
  min-height:0;
  overflow:hidden;
  background:#000;
  touch-action:none;
}
.layer{
  position:absolute;inset:0;
  pointer-events:none;
}
.layer canvas{
  position:absolute;inset:0;
  width:100%;height:100%;
}
#clipLayer{overflow:hidden}
#dividerLine{
  position:absolute;
  top:0;bottom:0;left:50%;
  width:2px;
  background:#fff;
  z-index:5;
  pointer-events:none;
  box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 12px rgba(0,0,0,.75);
}
#hint{
  position:absolute;inset:0;
  display:grid;place-items:center;
  padding:24px;
  text-align:center;
  color:#8f8f95;
  font-size:14px;line-height:1.55;
  pointer-events:none;
}
#hint strong{
  display:block;color:#fff;font-size:18px;margin-bottom:5px;
}
.hidden{display:none!important}

/* 下部操作部も通常レイアウト。余白を作らず画像に重ならない */
#bottomPanel{
  flex:0 0 auto;
  height:auto;
  min-height:0;
  max-height:none;
  background:rgba(15,15,17,.99);
  border-top:1px solid var(--line);
  padding:
    2px
    calc(4px + var(--safe-r))
    calc(2px + var(--safe-b))
    calc(4px + var(--safe-l));
}
#status{
  height:13px;
  min-height:13px;
  padding:0 2px;
  display:flex;
  align-items:center;
  color:var(--muted);
  font-size:9px;
  line-height:13px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
#buttonRow{
  display:grid;
  grid-template-columns:1.2fr 1fr 1fr .9fr .9fr 40px;
  gap:4px;
}
button,.btn{
  height:38px;min-width:0;
  border:0;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  padding:0 7px;
  background:#2b2b30;color:#fff;
  font-size:12px;font-weight:750;
  white-space:nowrap;
}
.btn.primary{background:#fff;color:#000}
button:disabled{opacity:.36}
input[type=file]{display:none}

#modeRow{
  height:32px;
  margin-top:3px;
  display:flex;
  gap:4px;
  align-items:center;
}
#modeSwitch{
  display:grid;
  grid-template-columns:1fr 1fr;
  width:118px;
  height:32px;
  padding:2px;
  background:#222226;
  border-radius:9px;
}
#modeSwitch button{
  height:28px;
  padding:0 7px;
  background:transparent;
  border-radius:7px;
  font-size:12px;
}
#modeSwitch button.active{background:#505057}
#modeInfo{
  flex:1;
  min-width:0;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 9px;
  border-radius:9px;
  background:#222226;
  color:var(--muted);
  font-size:12px;
}

/* 指の移動量を減らすため、比較バーは短めに中央配置 */
#sliderDock{
  width:100%;
  height:39px;
  flex:0 0 39px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  padding:0;
  margin:0;
}
#compareRange{
  appearance:none;
  -webkit-appearance:none;
  width:min(62vw,320px);
  height:36px;
  margin:0;
  padding:0;
  background:transparent;
  touch-action:pan-x;
}
#compareRange::-webkit-slider-runnable-track{
  height:10px;border-radius:999px;
  background:#5d5d64;
}
#compareRange::-webkit-slider-thumb{
  appearance:none;-webkit-appearance:none;
  width:34px;height:34px;
  border-radius:50%;
  margin-top:-12px;
  background:#fff;
  box-shadow:0 2px 10px rgba(0,0,0,.55);
}
#compareRange::-moz-range-track{
  height:10px;border-radius:999px;background:#5d5d64;
}
#compareRange::-moz-range-thumb{
  width:34px;height:34px;border:0;border-radius:50%;background:#fff;
}


/* 手動位置合わせ：必要な時だけ開く */
#manualPanel{
  display:none;
  margin-top:4px;
  padding:5px;
  border-radius:9px;
  background:#1c1c20;
  border:1px solid rgba(255,255,255,.08);
}
#manualPanel.open{display:block}
#manualGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px 8px;
}
.manualControl{
  display:grid;
  grid-template-columns:30px 1fr 42px;
  gap:4px;
  align-items:center;
  min-width:0;
}
.manualControl label{
  font-size:11px;
  color:var(--muted);
  text-align:center;
}
.manualControl output{
  font-size:10px;
  color:#fff;
  text-align:right;
  white-space:nowrap;
}
.manualControl input[type=range]{
  appearance:none;
  -webkit-appearance:none;
  width:100%;
  height:28px;
  margin:0;
  background:transparent;
}
.manualControl input[type=range]::-webkit-slider-runnable-track{
  height:5px;
  border-radius:999px;
  background:#5d5d64;
}
.manualControl input[type=range]::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;
  width:24px;
  height:24px;
  border-radius:50%;
  margin-top:-9.5px;
  background:#fff;
}
.manualControl input[type=range]::-moz-range-track{
  height:5px;
  border-radius:999px;
  background:#5d5d64;
}
.manualControl input[type=range]::-moz-range-thumb{
  width:24px;
  height:24px;
  border:0;
  border-radius:50%;
  background:#fff;
}
#manualFooter{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  margin-top:3px;
}
#manualHint{
  flex:1;
  min-width:0;
  color:var(--muted);
  font-size:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
#manualResetBtn{
  height:28px;
  padding:0 9px;
  font-size:10px;
}

/* 履歴 */
#historyModal{
  position:fixed;inset:0;z-index:50;
  display:none;align-items:flex-end;
  background:rgba(0,0,0,.58);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
#historyModal.open{display:flex}
#historySheet{
  width:100%;
  max-height:78dvh;
  padding:
    8px
    calc(8px + var(--safe-r))
    calc(8px + var(--safe-b))
    calc(8px + var(--safe-l));
  border-radius:20px 20px 0 0;
  background:#171719;
  border-top:1px solid rgba(255,255,255,.13);
  overflow:hidden;
}
#historyHeader{
  display:flex;align-items:center;gap:6px;
  min-height:46px;padding-bottom:6px;
}
#historyHeader strong{font-size:16px}
#historyHeader .spacer{flex:1}
#historyHeader button{height:36px;padding:0 10px;font-size:12px}
#historyList{
  max-height:calc(78dvh - 58px);
  overflow:auto;-webkit-overflow-scrolling:touch;
}
.historyEmpty{
  padding:42px 20px;text-align:center;
  color:var(--muted);font-size:14px;line-height:1.7;
}
.historyItem{
  display:grid;
  grid-template-columns:94px 1fr auto;
  gap:9px;align-items:center;
  padding:8px 3px;
  border-top:1px solid rgba(255,255,255,.08);
}
.historyThumbs{
  position:relative;width:94px;height:68px;
  border-radius:9px;overflow:hidden;background:#0b0b0c;
}
.historyThumbs img{
  position:absolute;
  width:62px;height:62px;
  object-fit:cover;border-radius:7px;
  border:1px solid rgba(255,255,255,.17);
  background:#000;
}
.historyThumbs img:first-child{left:0;top:3px}
.historyThumbs img:last-child{right:0;top:3px}
.historyMeta{min-width:0}
.historyMeta .date{font-size:13px;font-weight:750;margin-bottom:4px}
.historyMeta .names{
  color:var(--muted);
  font-size:11px;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.historyActions{display:flex;flex-direction:column;gap:5px}
.historyActions button{width:52px;height:32px;padding:0;font-size:11px}
.danger{background:#492326!important}
#historyCount{
  display:none;
  min-width:17px;height:17px;
  margin-left:2px;padding:0 4px;
  border-radius:99px;
  background:#fff;color:#000;
  font-size:9px;font-weight:800;
  align-items:center;justify-content:center;
}
#historyCount.show{display:inline-flex}

@media (display-mode:standalone){
  #bottomPanel{background:#101012}
}
@media (orientation:landscape) and (max-height:560px){
  #status{display:none}
  #buttonRow button,#buttonRow .btn{height:32px}
  #modeRow{height:30px}
  #sliderDock{height:34px;flex-basis:34px}
  #compareRange{height:32px;width:min(46vw,300px)}
}
</style>
</head>

<body>
<div id="app">
  

  <main id="stage">
    <div id="hint">
      <div><strong>画像を2枚選択</strong>「画像」から2枚まとめて選択できます。読み込み後に自動合致します</div>
    </div>

    <div class="layer"><canvas id="canvasA"></canvas></div>
    <div class="layer" id="clipLayer"><canvas id="canvasB"></canvas></div>
    <div id="dividerLine" class="hidden"></div>
  </main>

  <footer id="bottomPanel">
    <div id="status">準備完了</div>

    <div id="buttonRow">
      <label class="btn primary">
        画像
        <input id="files" type="file" accept="image/*" multiple>
      </label>
      <button id="swapBtn" disabled>入替</button>
      <button id="alignBtn" disabled>再合致</button>
      <button id="adjustBtn" disabled>調整</button>
      <button id="historyBtn">履歴 <span id="historyCount"></span></button>
      <button id="resetBtn" disabled aria-label="表示リセット">↺</button>
    </div>

    <div id="manualPanel">
      <div id="manualGrid">
        <div class="manualControl">
          <label for="manualX">横</label>
          <input id="manualX" type="range" min="-20" max="20" step="0.1" value="0">
          <output id="manualXValue">0.0%</output>
        </div>
        <div class="manualControl">
          <label for="manualY">縦</label>
          <input id="manualY" type="range" min="-20" max="20" step="0.1" value="0">
          <output id="manualYValue">0.0%</output>
        </div>
        <div class="manualControl">
          <label for="manualRotate">回転</label>
          <input id="manualRotate" type="range" min="-10" max="10" step="0.1" value="0">
          <output id="manualRotateValue">0.0°</output>
        </div>
        <div class="manualControl">
          <label for="manualScale">倍率</label>
          <input id="manualScale" type="range" min="80" max="120" step="0.1" value="100">
          <output id="manualScaleValue">100.0%</output>
        </div>
      </div>
      <div id="manualFooter">
        <span id="manualHint">画像2だけを微調整します</span>
        <button id="manualResetBtn">補正リセット</button>
      </div>
    </div>

    <div id="modeRow">
      <div id="modeSwitch">
        <button id="splitBtn" class="active" disabled>バー</button>
        <button id="fadeBtn" disabled>フェード</button>
      </div>
      <div id="modeInfo">
        <span id="modeLabel">比較位置</span>
        <span id="modeValue">50%</span>
      </div>
    </div>

    <div id="sliderDock">
      <input id="compareRange" type="range" min="0" max="100" value="50" disabled aria-label="比較位置">
    </div>
  </footer>

  <div id="historyModal" aria-hidden="true">
    <div id="historySheet">
      <div id="historyHeader">
        <strong>比較履歴</strong>
        <div class="spacer"></div>
        <button id="clearHistoryBtn">全削除</button>
        <button id="closeHistoryBtn">閉じる</button>
      </div>
      <div id="historyList"></div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);

const stage=$('stage');
const canvasA=$('canvasA'),canvasB=$('canvasB');
const ctxA=canvasA.getContext('2d'),ctxB=canvasB.getContext('2d');
const clipLayer=$('clipLayer');
const dividerLine=$('dividerLine');
const filesInput=$('files');
const swapBtn=$('swapBtn'),alignBtn=$('alignBtn'),adjustBtn=$('adjustBtn'),historyBtn=$('historyBtn'),resetBtn=$('resetBtn');
const splitBtn=$('splitBtn'),fadeBtn=$('fadeBtn');
const compareRange=$('compareRange'),modeLabel=$('modeLabel'),modeValue=$('modeValue');
const manualPanel=$('manualPanel');
const manualX=$('manualX'),manualY=$('manualY'),manualRotate=$('manualRotate'),manualScale=$('manualScale');
const manualXValue=$('manualXValue'),manualYValue=$('manualYValue'),manualRotateValue=$('manualRotateValue'),manualScaleValue=$('manualScaleValue');
const manualResetBtn=$('manualResetBtn');
const statusEl=$('status'),hint=$('hint');
const historyModal=$('historyModal'),historyList=$('historyList'),historyCount=$('historyCount');
const closeHistoryBtn=$('closeHistoryBtn'),clearHistoryBtn=$('clearHistoryBtn');

let imgA=null,imgB=null;
let blobA=null,blobB=null;
let metaA=null,metaB=null;
let alignedCanvas=null;

let mode='split';
let splitPct=50;
let fadePct=50;
let zoom=1;
let manualOffsetX=0;
let manualOffsetY=0;
let manualRotation=0;
let manualScaleFactor=1;
let aligning=false;
let openingHistory=false;

/* ---------- 基本描画 ---------- */
function status(t){statusEl.textContent=t}

function controlsReady(){
  const ok=!!(imgA&&imgB);
  [swapBtn,alignBtn,adjustBtn,splitBtn,fadeBtn,compareRange,resetBtn].forEach(x=>x.disabled=!ok);
  hint.classList.toggle('hidden',!!(imgA||imgB));
}

function resizeCanvas(c){
  const dpr=Math.min(3,Math.max(1,window.devicePixelRatio||1));
  const w=Math.max(1,stage.clientWidth),h=Math.max(1,stage.clientHeight);
  c.width=Math.round(w*dpr);
  c.height=Math.round(h*dpr);
  c.style.width=w+'px';
  c.style.height=h+'px';
  return dpr;
}

function containRect(iw,ih,W,H){
  const s=Math.min(W/iw,H/ih);
  return {x:(W-iw*s)/2,y:(H-ih*s)/2,w:iw*s,h:ih*s};
}

function draw(){
  const da=resizeCanvas(canvasA),db=resizeCanvas(canvasB);

  ctxA.setTransform(1,0,0,1,0,0);
  ctxB.setTransform(1,0,0,1,0,0);
  ctxA.clearRect(0,0,canvasA.width,canvasA.height);
  ctxB.clearRect(0,0,canvasB.width,canvasB.height);

  ctxA.setTransform(da,0,0,da,0,0);
  ctxB.setTransform(db,0,0,db,0,0);

  const W=stage.clientWidth,H=stage.clientHeight;

  if(imgA){
    const base=containRect(imgA.naturalWidth,imgA.naturalHeight,W,H);
    const r={
      w:base.w*zoom,
      h:base.h*zoom,
      x:W/2-(base.w*zoom)/2,
      y:H/2-(base.h*zoom)/2
    };
    ctxA.drawImage(imgA,r.x,r.y,r.w,r.h);

    if(imgB){
      let source=null;
      let br=null;

      if(alignedCanvas){
        source=alignedCanvas;
        br=r;
      }else{
        source=imgB;
        const bb=containRect(imgB.naturalWidth,imgB.naturalHeight,W,H);
        br={
          w:bb.w*zoom,
          h:bb.h*zoom,
          x:W/2-(bb.w*zoom)/2,
          y:H/2-(bb.h*zoom)/2
        };
      }

      const cx=W/2;
      const cy=H/2;
      const dx=(manualOffsetX/100)*r.w;
      const dy=(manualOffsetY/100)*r.h;

      ctxB.save();
      ctxB.translate(cx+dx,cy+dy);
      ctxB.rotate(manualRotation*Math.PI/180);
      ctxB.scale(manualScaleFactor,manualScaleFactor);
      ctxB.translate(-cx,-cy);
      ctxB.drawImage(source,br.x,br.y,br.w,br.h);
      ctxB.restore();
    }
  }else if(imgB){
    const base=containRect(imgB.naturalWidth,imgB.naturalHeight,W,H);
    const r={
      w:base.w*zoom,
      h:base.h*zoom,
      x:W/2-(base.w*zoom)/2,
      y:H/2-(base.h*zoom)/2
    };
    ctxB.drawImage(imgB,r.x,r.y,r.w,r.h);
  }

  applyMode();
}

function applyMode(){
  if(mode==='split'){
    clipLayer.style.opacity='1';
    clipLayer.style.clipPath=`inset(0 ${100-splitPct}% 0 0)`;
    dividerLine.style.left=splitPct+'%';
    dividerLine.classList.toggle('hidden',!(imgA&&imgB));

    compareRange.value=Math.round(splitPct);
    modeLabel.textContent='比較位置';
    modeValue.textContent=Math.round(splitPct)+'%';
    compareRange.setAttribute('aria-label','比較位置');
  }else{
    clipLayer.style.clipPath='none';
    clipLayer.style.opacity=String(fadePct/100);
    dividerLine.classList.add('hidden');

    compareRange.value=Math.round(fadePct);
    modeLabel.textContent='透明度';
    modeValue.textContent=Math.round(fadePct)+'%';
    compareRange.setAttribute('aria-label','透明度');
  }
}

function setMode(m){
  mode=m;
  splitBtn.classList.toggle('active',m==='split');
  fadeBtn.classList.toggle('active',m==='fade');
  applyMode();
}

splitBtn.onclick=()=>setMode('split');
fadeBtn.onclick=()=>setMode('fade');

compareRange.addEventListener('input',()=>{
  const v=Number(compareRange.value);
  if(mode==='split')splitPct=v;
  else fadePct=v;
  applyMode();
});


/* ---------- ピンチズーム（2枚を同時に同倍率で拡大縮小） ---------- */
let zoomPointers=new Map();
let pinchStartDistance=0;
let pinchStartZoom=1;

function pointerDistance(){
  const p=[...zoomPointers.values()];
  if(p.length<2)return 0;
  return Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
}

stage.addEventListener('pointerdown',e=>{
  if(!imgA)return;
  zoomPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(zoomPointers.size===2){
    pinchStartDistance=pointerDistance();
    pinchStartZoom=zoom;
  }
});

stage.addEventListener('pointermove',e=>{
  if(!zoomPointers.has(e.pointerId))return;
  zoomPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(zoomPointers.size===2 && pinchStartDistance>0){
    const d=pointerDistance();
    zoom=Math.max(0.65,Math.min(6,pinchStartZoom*(d/pinchStartDistance)));
    draw();
    e.preventDefault();
  }
},{passive:false});

function endZoomPointer(e){
  zoomPointers.delete(e.pointerId);
  if(zoomPointers.size<2){
    pinchStartDistance=0;
    pinchStartZoom=zoom;
  }
}
stage.addEventListener('pointerup',endZoomPointer);
stage.addEventListener('pointercancel',endZoomPointer);
stage.addEventListener('pointerleave',endZoomPointer);

/* ダブルタップ/ダブルクリックで倍率だけ1倍へ */
stage.addEventListener('dblclick',()=>{
  zoom=1;
  draw();
  status('ズームを1倍に戻しました');
});


/* ---------- 手動位置合わせ ---------- */
function updateManualOutputs(){
  manualXValue.textContent=manualOffsetX.toFixed(1)+'%';
  manualYValue.textContent=manualOffsetY.toFixed(1)+'%';
  manualRotateValue.textContent=manualRotation.toFixed(1)+'°';
  manualScaleValue.textContent=(manualScaleFactor*100).toFixed(1)+'%';
}

function syncManualInputs(){
  manualX.value=String(manualOffsetX);
  manualY.value=String(manualOffsetY);
  manualRotate.value=String(manualRotation);
  manualScale.value=String(manualScaleFactor*100);
  updateManualOutputs();
}

function resetManual(redraw=true){
  manualOffsetX=0;
  manualOffsetY=0;
  manualRotation=0;
  manualScaleFactor=1;
  syncManualInputs();
  if(redraw)draw();
}

adjustBtn.onclick=()=>{
  const open=!manualPanel.classList.contains('open');
  manualPanel.classList.toggle('open',open);
  adjustBtn.classList.toggle('active',open);
  if(open){
    syncManualInputs();
    status('手動調整：横・縦・回転・倍率で画像2を合わせられます');
  }
};

manualX.addEventListener('input',()=>{
  manualOffsetX=Number(manualX.value);
  updateManualOutputs();
  draw();
});
manualY.addEventListener('input',()=>{
  manualOffsetY=Number(manualY.value);
  updateManualOutputs();
  draw();
});
manualRotate.addEventListener('input',()=>{
  manualRotation=Number(manualRotate.value);
  updateManualOutputs();
  draw();
});
manualScale.addEventListener('input',()=>{
  manualScaleFactor=Number(manualScale.value)/100;
  updateManualOutputs();

function fileToImage(blob){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(blob);
    const im=new Image();
    im.onload=()=>{URL.revokeObjectURL(url);resolve(im)};
    im.onerror=e=>{URL.revokeObjectURL(url);reject(e)};
    im.src=url;
  });
}

function fmeta(f){
  return {
    name:f?.name||'画像',
    size:Number(f?.size||0),
    lastModified:Number(f?.lastModified||0),
    type:f?.type||'image/*'
  };
}

/* ---------- Diffchecker風の高精度位置合わせ ---------- */
/*
  方針:
  1. 低照度でも特徴点が出るようにグレースケール + ヒストグラム平坦化
  2. ORBを多めに抽出
  3. KNN + ratio testで候補を絞る
  4. まずRANSACのAffineで「移動・回転・拡大縮小」を推定
  5. Affineの信頼度が低い時だけPerspective(Homography)を試す
  6. 変形後の重なり具合を評価して、悪化する変換は採用しない

  Diffcheckerの独自実装そのものではないが、同じく
  「共通ディテールを探して offset / rotation / scale を解く」方式。
*/
let cvPromise=null;

function ensureOpenCV(){
  if(cvPromise)return cvPromise;

  cvPromise=new Promise((resolve,reject)=>{
    let settled=false;

    const done=()=>{
      if(settled)return;
      try{
        if(window.cv && typeof window.cv.then==='function'){
          window.cv.then(v=>{
            if(settled)return;
            settled=true;
            resolve(v);
          }).catch(reject);
        }else if(window.cv && window.cv.Mat){
          settled=true;
          resolve(window.cv);
        }
      }catch(e){
        reject(e);
      }
    };

    if(window.cv){
      done();
      return;
    }

    window.Module=window.Module||{};
    const oldReady=window.Module.onRuntimeInitialized;
    window.Module.onRuntimeInitialized=()=>{
      try{ oldReady?.(); }catch(_){}
      done();
    };

    const s=document.createElement('script');
    s.src='https://docs.opencv.org/4.10.0/opencv.js';
    s.async=true;
    s.onload=()=>setTimeout(done,0);
    s.onerror=()=>reject(new Error('OpenCVの読み込みに失敗しました'));
    document.head.appendChild(s);

    setTimeout(()=>{
      if(!settled && !window.cv){
        reject(new Error('OpenCVの読み込みがタイムアウトしました'));
      }
    },25000);
  });

  return cvPromise;
}

function imageToMat(cv,im){
  const c=document.createElement('canvas');
  c.width=im.naturalWidth;
  c.height=im.naturalHeight;
  c.getContext('2d').drawImage(im,0,0);
  return cv.imread(c);
}

function prepGray(cv,src,maxSide=1400){
  const scale=Math.min(1,maxSide/Math.max(src.cols,src.rows));
  const small=new cv.Mat();
  cv.resize(src,small,new cv.Size(0,0),scale,scale,cv.INTER_AREA);

  const gray=new cv.Mat();
  cv.cvtColor(small,gray,cv.COLOR_RGBA2GRAY);

  const eq=new cv.Mat();
  cv.equalizeHist(gray,eq);
  gray.delete();

  return {mat:eq,scale,small};
}

function createOrb(cv){
  // OpenCV.jsのビルド差に備えて、完全引数 → 簡易引数 → デフォルトの順に試す
  try{
    return new cv.ORB(7000,1.2,8,31,0,2,cv.ORB_HARRIS_SCORE ?? 0,31,7);
  }catch(_){
    try{return new cv.ORB(7000)}
    catch(__){return new cv.ORB()}
  }
}

function collectGoodMatches(cv,kpA,kpB,desA,desB){
  const matcher=new cv.BFMatcher(cv.NORM_HAMMING,false);
  const fwd=new cv.DMatchVectorVector();
  matcher.knnMatch(desB,desA,fwd,2);

  const good=[];
  for(let i=0;i<fwd.size();i++){
    const pair=fwd.get(i);
    if(pair.size()>=2){
      const m0=pair.get(0);
      const m1=pair.get(1);
      // Diffcheckerのように「共通部分」を優先するため、少し緩めに拾ってRANSACで落とす
      if(m0.distance < 0.80*m1.distance){
        good.push({
          queryIdx:m0.queryIdx,
          trainIdx:m0.trainIdx,
          distance:m0.distance
        });
      }
    }
    pair.delete();
  }

  fwd.delete();
  matcher.delete();

  // 良い順に上限を設け、RANSACを安定させる
  good.sort((a,b)=>a.distance-b.distance);
  return good.slice(0,1800);
}

function matchPointsToFullRes(kpA,kpB,matches,scaleA,scaleB,wA,hA){
  const all=[];
  const outer=[];

  for(const m of matches){
    const pb=kpB.get(m.queryIdx).pt;
    const pa=kpA.get(m.trainIdx).pt;

    const ax=pa.x/scaleA, ay=pa.y/scaleA;
    const bx=pb.x/scaleB, by=pb.y/scaleB;

    const item={ax,ay,bx,by};

    all.push(item);

    // 人物編集などで中央が変わっても背景で合わせやすいよう、
    // 外周側の特徴点も別候補として保持する
    const nx=Math.abs(ax-wA/2)/(wA/2);
    const ny=Math.abs(ay-hA/2)/(hA/2);
    if(nx>0.42 || ny>0.42){
      outer.push(item);
    }
  }

  // 外周だけで十分な点が取れているなら優先
  return outer.length>=18 ? outer : all;
}

function pointsToMats(cv,pts){
  const src=[],dst=[];
  for(const p of pts){
    src.push(p.bx,p.by);
    dst.push(p.ax,p.ay);
  }
  return {
    srcPts:cv.matFromArray(pts.length,1,cv.CV_32FC2,src),
    dstPts:cv.matFromArray(pts.length,1,cv.CV_32FC2,dst)
  };
}

function countInliers(mask){
  if(!mask || mask.empty())return 0;
  let n=0;
  for(let i=0;i<mask.rows;i++){
    try{
      if(mask.ucharPtr(i,0)[0])n++;
    }catch(_){}
  }
  return n;
}

function estimateAffineCandidate(cv,srcPts,dstPts){
  const inliers=new cv.Mat();
  let M=null;

  try{
    // 新しめのOpenCV.js
    M=cv.estimateAffine2D(
      srcPts,dstPts,inliers,
      cv.RANSAC,3.0,3000,0.995,10
    );
  }catch(_){
    try{
      // ビルド差に対応
      M=cv.estimateAffine2D(srcPts,dstPts,inliers,cv.RANSAC);
    }catch(__){}
  }

  const n=countInliers(inliers);
  return {M,inliers,count:n};
}

function estimateHomographyCandidate(cv,srcPts,dstPts){
  const inliers=new cv.Mat();
  let H=null;

  try{
    H=cv.findHomography(srcPts,dstPts,cv.RANSAC,4.0,inliers);
  }catch(_){
    try{
      H=cv.findHomography(srcPts,dstPts,cv.RANSAC,4.0);
    }catch(__){}
  }

  const n=countInliers(inliers);
  return {H,inliers,count:n};
}

function warpWithAffine(cv,src,M,w,h){
  const out=new cv.Mat();
  cv.warpAffine(
    src,out,M,new cv.Size(w,h),
    cv.INTER_LINEAR,cv.BORDER_CONSTANT,new cv.Scalar(0,0,0,0)
  );
  return out;
}

function warpWithHomography(cv,src,H,w,h){
  const out=new cv.Mat();
  cv.warpPerspective(
    src,out,H,new cv.Size(w,h),
    cv.INTER_LINEAR,cv.BORDER_CONSTANT,new cv.Scalar(0,0,0,0)
  );
  return out;
}

function alignmentScore(cv,reference,warped){
  // 透明領域を除いた「エッジの一致度」を0〜1で評価
  let refGray,warpGray,refEdge,warpEdge,alpha,mask,diff;

  try{
    refGray=new cv.Mat();
    warpGray=new cv.Mat();
    cv.cvtColor(reference,refGray,cv.COLOR_RGBA2GRAY);
    cv.cvtColor(warped,warpGray,cv.COLOR_RGBA2GRAY);

    // サイズを小さくして評価を軽量化
    const maxSide=700;
    const s=Math.min(1,maxSide/Math.max(reference.cols,reference.rows));
    const rr=new cv.Mat(),ww=new cv.Mat();
    cv.resize(refGray,rr,new cv.Size(0,0),s,s,cv.INTER_AREA);
    cv.resize(warpGray,ww,new cv.Size(0,0),s,s,cv.INTER_AREA);

    refEdge=new cv.Mat();
    warpEdge=new cv.Mat();
    cv.Canny(rr,refEdge,55,130);
    cv.Canny(ww,warpEdge,55,130);

    diff=new cv.Mat();
    cv.absdiff(refEdge,warpEdge,diff);

    const meanDiff=cv.mean(diff)[0]/255;

    rr.delete();ww.delete();

    // 1が良い、0が悪い
    return Math.max(0,1-meanDiff);
  }catch(_){
    return 0;
  }finally{
    for(const x of [refGray,warpGray,refEdge,warpEdge,alpha,mask,diff]){
      try{if(x&&x.delete)x.delete()}catch(_){}
    }
  }
}

function matToCanvas(cv,mat){
  const c=document.createElement('canvas');
  c.width=mat.cols;
  c.height=mat.rows;
  cv.imshow(c,mat);
  return c;
}

async function autoAlign(silent=false){
  if(aligning||!imgA||!imgB)return;

  aligning=true;
  alignBtn.disabled=true;
  status('共通部分を探して自動合致中…');

  let cv;
  let srcA,srcB;
  let prepA,prepB;
  let kpA,kpB,desA,desB,mask,orb;
  let srcPts,dstPts;
  let affine,inliersA,homography,inliersH;
  let warpedA=null,warpedH=null;

  try{
    cv=await ensureOpenCV();

    srcA=imageToMat(cv,imgA);
    srcB=imageToMat(cv,imgB);

    prepA=prepGray(cv,srcA);
    prepB=prepGray(cv,srcB);

    kpA=new cv.KeyPointVector();
    kpB=new cv.KeyPointVector();
    desA=new cv.Mat();
    desB=new cv.Mat();
    mask=new cv.Mat();
    orb=createOrb(cv);

    orb.detectAndCompute(prepA.mat,mask,kpA,desA);
    orb.detectAndCompute(prepB.mat,mask,kpB,desB);

    if(desA.empty()||desB.empty()){
      throw new Error('共通の特徴点を検出できませんでした');
    }

    const matches=collectGoodMatches(cv,kpA,kpB,desA,desB);

    if(matches.length<10){
      throw new Error('共通部分が少なすぎます');
    }

    const pts=matchPointsToFullRes(
      kpA,kpB,matches,
      prepA.scale,prepB.scale,
      srcA.cols,srcA.rows
    );

    if(pts.length<8){
      throw new Error('位置合わせに必要な一致点が不足しています');
    }

    const mats=pointsToMats(cv,pts);
    srcPts=mats.srcPts;
    dstPts=mats.dstPts;

    // まずDiffcheckerの基本挙動に近い「移動・回転・拡大縮小」を優先
    const ac=estimateAffineCandidate(cv,srcPts,dstPts);
    affine=ac.M;
    inliersA=ac.inliers;

    let best=null;

    if(affine && !affine.empty() && ac.count>=8){
      warpedA=warpWithAffine(cv,srcB,affine,srcA.cols,srcA.rows);
      const score=alignmentScore(cv,srcA,warpedA);
      best={
        kind:'affine',
        mat:warpedA,
        inliers:ac.count,
        ratio:ac.count/pts.length,
        score
      };
    }

    // Affineが弱い時だけパース補正候補も計算
    if(!best || best.ratio<0.36 || best.score<0.72){
      const hc=estimateHomographyCandidate(cv,srcPts,dstPts);
      homography=hc.H;
      inliersH=hc.inliers;

      if(homography && !homography.empty() && hc.count>=8){
        warpedH=warpWithHomography(cv,srcB,homography,srcA.cols,srcA.rows);
        const score=alignmentScore(cv,srcA,warpedH);
        const candidate={
          kind:'perspective',
          mat:warpedH,
          inliers:hc.count,
          ratio:hc.count/pts.length,
          score
        };

        // Perspectiveは暴れやすいので、明確に良い時だけ採用
        if(
          !best ||
          (
            candidate.ratio>=0.28 &&
            candidate.score>best.score+0.015
          )
        ){
          best=candidate;
        }
      }
    }

    if(!best){
      throw new Error('信頼できる変換を求められませんでした');
    }

    // 変換の信頼度が低すぎる時は、無理に画像を歪めない
    if(best.inliers<8 || best.ratio<0.18){
      throw new Error('一致の信頼度が低すぎます');
    }

    alignedCanvas=matToCanvas(cv,best.mat);
    resetManual(false);
    draw();

    const label=best.kind==='affine'?'移動・回転・倍率':'パース補正';
    status(`自動合致完了：${label} / 一致 ${best.inliers}点`);
  }catch(err){
    console.error(err);
    alignedCanvas=null;
    draw();
    status('自動合致できませんでした。「調整」で手動補正できます');
  }finally{
    for(const x of [
      srcA,srcB,
      prepA?.mat,prepA?.small,
      prepB?.mat,prepB?.small,
      kpA,kpB,desA,desB,mask,orb,
      srcPts,dstPts,
      affine,inliersA,homography,inliersH,
      warpedA,warpedH
    ]){
      try{if(x&&x.delete)x.delete()}catch(_){}
    }

    aligning=false;
    controlsReady();
  }
}

/* ---------- 比較履歴：端末内に最大20組 ---------- */
const DB_NAME='image-compare-history-v2';
const STORE='pairs';
const MAX_HISTORY=20;
let dbPromise=null;

function openDb(){
  if(dbPromise)return dbPromise;

  dbPromise=new Promise((resolve,reject)=>{
    const q=indexedDB.open(DB_NAME,1);

    q.onupgradeneeded=()=>{
      const db=q.result;
      const st=db.createObjectStore(STORE,{keyPath:'id'});
      st.createIndex('createdAt','createdAt');
      st.createIndex('pairKey','pairKey');
    };

    q.onsuccess=()=>resolve(q.result);
    q.onerror=()=>reject(q.error);
  });

  return dbPromise;
}

function reqp(q){
  return new Promise((res,rej)=>{
    q.onsuccess=()=>res(q.result);
    q.onerror=()=>rej(q.error);
  });
}

function pairKey(){
  const a=metaA||{},b=metaB||{};
  return [a.name,a.size,a.lastModified,b.name,b.size,b.lastModified].join('|');
}

async function thumb(blob,max=160){
  const im=await fileToImage(blob);
  const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));

  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(im.naturalWidth*s));
  c.height=Math.max(1,Math.round(im.naturalHeight*s));
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);

  return await new Promise(r=>c.toBlob(r,'image/jpeg',.72));
}

async function allHistory(){
  const db=await openDb();
  const tx=db.transaction(STORE,'readonly');
  const list=await reqp(tx.objectStore(STORE).getAll());
  return list.sort((a,b)=>b.createdAt-a.createdAt);
}

async function saveCurrentPair(){
  if(!blobA||!blobB)return;

  const db=await openDb();
  const list=await allHistory();
  const key=pairKey();
  const same=list.find(x=>x.pairKey===key);

  if(same){
    same.createdAt=Date.now();
    const tx=db.transaction(STORE,'readwrite');
    await reqp(tx.objectStore(STORE).put(same));
  }else{
    let ta=null,tb=null;
    try{
      [ta,tb]=await Promise.all([thumb(blobA),thumb(blobB)]);
    }catch(_){}

    const item={
      id:'p-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),
      pairKey:key,
      createdAt:Date.now(),
      blobA,blobB,metaA,metaB,
      thumbA:ta,thumbB:tb
    };

    const tx=db.transaction(STORE,'readwrite');
    await reqp(tx.objectStore(STORE).put(item));
  }

  const now=await allHistory();

  if(now.length>MAX_HISTORY){
    const tx=db.transaction(STORE,'readwrite');
    const st=tx.objectStore(STORE);
    now.slice(MAX_HISTORY).forEach(x=>st.delete(x.id));
  }

  try{navigator.storage?.persist?.()}catch(_){}
  refreshHistoryCount();
}

async function refreshHistoryCount(){
  try{
    const n=(await allHistory()).length;
    historyCount.textContent=String(n);
    historyCount.classList.toggle('show',n>0);
  }catch(_){}
}

function fmtDate(ts){
  return new Intl.DateTimeFormat(
    'ja-JP',
    {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}
  ).format(new Date(ts));
}

function objUrl(b){
  return b?URL.createObjectURL(b):'';
}

async function renderHistory(){
  const list=await allHistory();
  historyList.innerHTML='';

  if(!list.length){
    historyList.innerHTML='<div class="historyEmpty">まだ履歴はありません<br>2枚を読み込むと自動保存されます</div>';
    return;
  }

  for(const it of list){
    const row=document.createElement('div');
    row.className='historyItem';

    const thumbs=document.createElement('div');
    thumbs.className='historyThumbs';

    for(const bb of [it.thumbA||it.blobA,it.thumbB||it.blobB]){
      const im=document.createElement('img');
      const u=objUrl(bb);
      im.src=u;
      im.onload=()=>URL.revokeObjectURL(u);
      thumbs.append(im);
    }

    const meta=document.createElement('div');
    meta.className='historyMeta';
    meta.innerHTML='<div class="date">'+fmtDate(it.createdAt)+'</div><div class="names"></div>';
    meta.querySelector('.names').textContent=
      (it.metaA?.name||'画像1')+' × '+(it.metaB?.name||'画像2');

    const actions=document.createElement('div');
    actions.className='historyActions';

    const op=document.createElement('button');
    op.textContent='開く';
    op.onclick=async()=>{
      closeHistory();
      openingHistory=true;
      try{
        await loadPair(it.blobA,it.blobB,it.metaA,it.metaB,{save:false});
      }finally{
        openingHistory=false;
      }
    };

    const del=document.createElement('button');
    del.textContent='削除';
    del.className='danger';
    del.onclick=async()=>{
      const db=await openDb();
      const tx=db.transaction(STORE,'readwrite');
      await reqp(tx.objectStore(STORE).delete(it.id));
      await renderHistory();
      refreshHistoryCount();
    };

    actions.append(op,del);
    row.append(thumbs,meta,actions);
    historyList.append(row);
  }
}

async function openHistory(){
  await renderHistory();
  historyModal.classList.add('open');
  historyModal.setAttribute('aria-hidden','false');
}

function closeHistory(){
  historyModal.classList.remove('open');
  historyModal.setAttribute('aria-hidden','true');
}

historyBtn.onclick=openHistory;
closeHistoryBtn.onclick=closeHistory;
historyModal.addEventListener('click',e=>{
  if(e.target===historyModal)closeHistory();
});

clearHistoryBtn.onclick=async()=>{
  if(!confirm('比較履歴をすべて削除しますか？'))return;

  const db=await openDb();
  const tx=db.transaction(STORE,'readwrite');
  await reqp(tx.objectStore(STORE).clear());

  await renderHistory();
  refreshHistoryCount();
};

refreshHistoryCount();

/* ---------- GitHub Pagesの最新版を自動反映 ---------- */
const APP_VERSION=document.querySelector('meta[name="app-version"]')?.content||'0';
let checking=false;

async function checkForUpdate(){
  if(checking||!/^https?:$/.test(location.protocol))return;

  checking=true;

  try{
    const clean=location.origin+location.pathname;
    const r=await fetch(clean+'?__update_check='+Date.now(),{
      cache:'no-store',
      headers:{'Cache-Control':'no-cache'}
    });

    if(!r.ok)return;

    const t=await r.text();
    const m=t.match(/<meta\s+name=["']app-version["']\s+content=["']([^"']+)["']/i);
    const remote=m?.[1];

    if(remote&&remote!==APP_VERSION){
      status('最新版を反映します…');
      const u=new URL(clean);
      u.searchParams.set('__updated',Date.now().toString());
      location.replace(u.toString());
    }
  }catch(_){
  }finally{
    checking=false;
  }
}

window.addEventListener('pageshow',()=>setTimeout(checkForUpdate,500));
window.addEventListener('focus',()=>setTimeout(checkForUpdate,500));
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    setTimeout(checkForUpdate,500);
  }
});

setTimeout(checkForUpdate,1200);

window.addEventListener('resize',()=>setTimeout(draw,60));
window.visualViewport?.addEventListener('resize',()=>setTimeout(draw,60));
</script>
</body>
