<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>画像比較</title>

<style>
:root{
  --safe-t: env(safe-area-inset-top,0px);
  --safe-r: env(safe-area-inset-right,0px);
  --safe-b: env(safe-area-inset-bottom,0px);
  --safe-l: env(safe-area-inset-left,0px);
  --panel: rgba(20,20,22,.86);
  --panel2: rgba(34,34,37,.94);
  --line: rgba(255,255,255,.17);
  --text: #fff;
  --muted: rgba(255,255,255,.68);
  --btnh: 48px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;
  background:#000;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  overscroll-behavior:none;
  overflow:hidden;
}
button,input{font:inherit}
button{color:inherit}
#app{
  position:fixed;inset:0;
  width:100vw;height:100dvh;
  background:#000;
  overflow:hidden;
}
#stage{
  position:absolute;inset:0;
  overflow:hidden;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  background:#000;
}
.layer{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.layer canvas{
  position:absolute;inset:0;
  width:100%;height:100%;
}
#clipLayer{overflow:hidden}
#hint{
  position:absolute;inset:0;
  display:grid;place-items:center;
  padding:30px 24px calc(150px + var(--safe-b));
  text-align:center;color:#9a9aa0;font-size:15px;line-height:1.6;
  pointer-events:none;
}
#hint strong{display:block;color:#fff;font-size:18px;margin-bottom:4px}

#divider{
  position:absolute;top:0;bottom:0;left:50%;
  width:2px;background:#fff;z-index:8;
  box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 16px rgba(0,0,0,.8);
  touch-action:none;
}
#dividerHit{
  position:absolute;left:50%;top:0;bottom:0;
  width:56px;transform:translateX(-50%);
  cursor:ew-resize;
}
#dividerHandle{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:52px;height:52px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(0,0,0,.76);
  border:1px solid rgba(255,255,255,.65);
  box-shadow:0 5px 22px rgba(0,0,0,.35);
  font-size:22px;font-weight:700;
}
#dividerHandle::before{content:"↔"}

#topBar{
  position:absolute;
  top:calc(10px + var(--safe-t));
  left:calc(10px + var(--safe-l));
  right:calc(10px + var(--safe-r));
  z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  pointer-events:none;
}
.pill{
  min-height:36px;padding:8px 12px;border-radius:999px;
  background:rgba(0,0,0,.64);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  font-size:12px;color:#fff;
  pointer-events:auto;
}
#statusPill{
  max-width:min(72vw,520px);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.iconBtn{
  width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  font-size:18px;font-weight:700;
  pointer-events:auto;
}

#controls{
  position:absolute;
  z-index:30;
  left:calc(8px + var(--safe-l));
  right:calc(8px + var(--safe-r));
  bottom:calc(8px + var(--safe-b));
  padding:10px;
  border-radius:20px;
  background:var(--panel);
  border:1px solid rgba(255,255,255,.10);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 10px 40px rgba(0,0,0,.42);
}
.row{display:flex;gap:8px;align-items:center}
.row + .row{margin-top:8px}
.grow{flex:1;min-width:0}
button,.btn{
  height:var(--btnh);
  min-width:48px;
  border:0;border-radius:14px;
  background:#303034;
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  gap:7px;padding:0 13px;
  font-size:14px;font-weight:700;
  white-space:nowrap;
}
button:disabled{opacity:.38}
.primary{background:#fff;color:#000}
.subtle{background:#242427}
input[type=file]{display:none}

.segmented{
  display:grid;grid-template-columns:1fr 1fr;
  background:#222225;border-radius:13px;padding:3px;
  min-width:148px;height:44px;
}
.segmented button{
  height:38px;border-radius:10px;padding:0 10px;background:transparent;
  font-size:13px;
}
.segmented button.active{
  background:#4a4a50;
  box-shadow:0 1px 8px rgba(0,0,0,.25);
}

#fadeBlock{
  display:flex;align-items:center;gap:9px;
  flex:1;min-width:0;height:44px;
  padding:0 10px;border-radius:13px;background:#222225;
}
#fadeBlock span{font-size:12px;color:var(--muted);min-width:32px}
#opacityValue{text-align:right}
input[type=range]{
  appearance:none;-webkit-appearance:none;
  width:100%;height:32px;background:transparent;margin:0;
}
input[type=range]::-webkit-slider-runnable-track{
  height:6px;border-radius:99px;background:#59595f;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:28px;height:28px;border-radius:50%;
  background:#fff;margin-top:-11px;
  box-shadow:0 2px 9px rgba(0,0,0,.45);
}
input[type=range]::-moz-range-track{
  height:6px;border-radius:99px;background:#59595f
}
input[type=range]::-moz-range-thumb{
  width:28px;height:28px;border-radius:50%;border:0;background:#fff
}

#miniControls{
  position:absolute;
  z-index:31;
  left:50%;transform:translateX(-50%);
  bottom:calc(12px + var(--safe-b));
  display:none;
  gap:8px;
}
#miniControls button{
  height:46px;border-radius:999px;
  background:rgba(0,0,0,.72);
  border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}

.hidden{display:none!important}

@media (max-width:520px){
  #controls{padding:8px;border-radius:18px}
  button,.btn{padding:0 10px;font-size:13px}
  .desktopText{display:none}
  #selectBtn{flex:1.35}
  #swapBtn,#alignBtn{flex:1}
  #fullBtn{width:48px;padding:0}
}
@media (orientation:landscape) and (max-height:560px){
  #controls{
    left:auto;
    width:min(390px,48vw);
    top:calc(8px + var(--safe-t));
    bottom:auto;
    right:calc(8px + var(--safe-r));
  }
  #topBar{right:calc(410px + var(--safe-r))}
  #hint{padding-bottom:30px;padding-right:420px}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="hint"><div><strong>2枚の画像を選択</strong>自動位置合わせ後、バー比較・フェード比較ができます</div></div>

    <div class="layer"><canvas id="canvasA"></canvas></div>
    <div class="layer" id="clipLayer"><canvas id="canvasB"></canvas></div>

    <div id="divider" class="hidden">
      <div id="dividerHit"></div>
      <div id="dividerHandle"></div>
    </div>
  </div>

  <div id="topBar">
    <div id="statusPill" class="pill">準備中…</div>
    <button id="uiToggle" class="iconBtn" aria-label="操作パネルを隠す">⌄</button>
  </div>

  <div id="controls">
    <div class="row">
      <label id="selectBtn" class="btn primary grow">
        <span>画像を選択</span>
        <input id="files" type="file" accept="image/*" multiple>
      </label>
      <button id="swapBtn" class="grow" disabled>入替</button>
      <button id="alignBtn" class="grow" disabled>自動合致</button>
      <button id="fullBtn" title="表示最大化">⛶</button>
    </div>

    <div class="row">
      <div class="segmented">
        <button id="splitBtn" class="active" disabled>バー</button>
        <button id="fadeBtn" disabled>フェード</button>
      </div>

      <div id="fadeBlock">
        <span>A</span>
        <input id="opacity" type="range" min="0" max="100" value="50" disabled>
        <span id="opacityValue">50%</span>
      </div>

      <button id="resetBtn" class="subtle" disabled>↺</button>
    </div>
  </div>

  <div id="miniControls">
    <button id="showUiBtn">操作を表示</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

const stage = $('stage');
const canvasA = $('canvasA');
const canvasB = $('canvasB');
const ctxA = canvasA.getContext('2d');
const ctxB = canvasB.getContext('2d');
const clipLayer = $('clipLayer');
const divider = $('divider');
const dividerHit = $('dividerHit');
const filesInput = $('files');
const swapBtn = $('swapBtn');
const alignBtn = $('alignBtn');
const splitBtn = $('splitBtn');
const fadeBtn = $('fadeBtn');
const opacity = $('opacity');
const opacityValue = $('opacityValue');
const resetBtn = $('resetBtn');
const fullBtn = $('fullBtn');
const statusPill = $('statusPill');
const hint = $('hint');
const controls = $('controls');
const topBar = $('topBar');
const uiToggle = $('uiToggle');
const miniControls = $('miniControls');
const showUiBtn = $('showUiBtn');

let imgA = null, imgB = null;
let alignedBData = null;
let cvReady = false;
let mode = 'split';
let dividerPct = 50;
let userScale = 1, panX = 0, panY = 0;

function status(t){ statusPill.textContent=t; }
function controlsReady(){
  const ok=!!(imgA&&imgB);
  [swapBtn,alignBtn,splitBtn,fadeBtn,opacity,resetBtn].forEach(el=>el.disabled=!ok);
  hint.classList.toggle('hidden', !!(imgA||imgB));
}
function setMode(m){
  mode=m;
  splitBtn.classList.toggle('active',m==='split');
  fadeBtn.classList.toggle('active',m==='fade');
  applyMode();
}
function applyMode(){
  if(mode==='split'){
    clipLayer.style.opacity='1';
    clipLayer.style.clipPath=`inset(0 ${100-dividerPct}% 0 0)`;
    divider.style.left=`${dividerPct}%`;
    divider.classList.toggle('hidden',!(imgA&&imgB));
  }else{
    clipLayer.style.clipPath='none';
    clipLayer.style.opacity=String(Number(opacity.value)/100);
    divider.classList.add('hidden');
  }
}
function fitRect(imgW,imgH,boxW,boxH){
  const s=Math.min(boxW/imgW,boxH/imgH)*userScale;
  return {w:imgW*s,h:imgH*s,x:(boxW-imgW*s)/2+panX,y:(boxH-imgH*s)/2+panY};
}
function resizeCanvas(c){
  const dpr=Math.min(3,Math.max(1,window.devicePixelRatio||1));
  const w=Math.max(1,stage.clientWidth), h=Math.max(1,stage.clientHeight);
  c.width=Math.round(w*dpr); c.height=Math.round(h*dpr);
  c.style.width=w+'px'; c.style.height=h+'px';
  return dpr;
}
function draw(){
  const da=resizeCanvas(canvasA), db=resizeCanvas(canvasB);
  ctxA.setTransform(1,0,0,1,0,0);ctxB.setTransform(1,0,0,1,0,0);
  ctxA.clearRect(0,0,canvasA.width,canvasA.height);
  ctxB.clearRect(0,0,canvasB.width,canvasB.height);
  ctxA.setTransform(da,0,0,da,0,0);ctxB.setTransform(db,0,0,db,0,0);

  const W=stage.clientWidth,H=stage.clientHeight;
  if(imgA){
    const r=fitRect(imgA.naturalWidth,imgA.naturalHeight,W,H);
    ctxA.drawImage(imgA,r.x,r.y,r.w,r.h);
  }
  if(imgB){
    if(alignedBData){
      const off=document.createElement('canvas');
      off.width=alignedBData.width;off.height=alignedBData.height;
      off.getContext('2d').putImageData(alignedBData,0,0);
      const bw=imgA?imgA.naturalWidth:alignedBData.width;
      const bh=imgA?imgA.naturalHeight:alignedBData.height;
      const r=fitRect(bw,bh,W,H);
      ctxB.drawImage(off,r.x,r.y,r.w,r.h);
    }else{
      const r=fitRect(imgB.naturalWidth,imgB.naturalHeight,W,H);
      ctxB.drawImage(imgB,r.x,r.y,r.w,r.h);
    }
  }
  applyMode();
}

function fileToImage(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};
    img.onerror=e=>{URL.revokeObjectURL(url);reject(e)};
    img.src=url;
  });
}
filesInput.addEventListener('change',async e=>{
  const fs=[...e.target.files];
  if(!fs.length)return;
  try{
    status('画像を読み込み中…');
    if(fs.length>=2){
      [imgA,imgB]=await Promise.all([fileToImage(fs[0]),fileToImage(fs[1])]);
    }else{
      const im=await fileToImage(fs[0]);
      if(!imgA) imgA=im;
      else imgB=im;
    }
    alignedBData=null;controlsReady();draw();
    if(imgA&&imgB){
      status(cvReady?'自動位置合わせ中…':'2枚読み込み完了');
      if(cvReady) autoAlign();
    }else status('もう1枚選択してください');
  }catch(err){status('画像を読み込めませんでした')}
  filesInput.value='';
});

splitBtn.onclick=()=>setMode('split');
fadeBtn.onclick=()=>setMode('fade');
opacity.oninput=()=>{
  opacityValue.textContent=opacity.value+'%';
  if(mode==='fade')applyMode();
};

let draggingDivider=false;
function dividerFromX(x){
  const r=stage.getBoundingClientRect();
  dividerPct=Math.max(0,Math.min(100,(x-r.left)/r.width*100));
  applyMode();
}
dividerHit.addEventListener('pointerdown',e=>{
  draggingDivider=true;dividerHit.setPointerCapture(e.pointerId);dividerFromX(e.clientX);
});
dividerHit.addEventListener('pointermove',e=>{if(draggingDivider)dividerFromX(e.clientX)});
dividerHit.addEventListener('pointerup',()=>draggingDivider=false);
dividerHit.addEventListener('pointercancel',()=>draggingDivider=false);

swapBtn.onclick=()=>{
  [imgA,imgB]=[imgB,imgA];
  alignedBData=null;
  draw();
  status('入れ替えました');
  if(cvReady)autoAlign();
};
resetBtn.onclick=()=>{
  dividerPct=50;opacity.value=50;opacityValue.textContent='50%';
  userScale=1;panX=0;panY=0;setMode('split');draw();status('表示をリセットしました');
};

/* iPhone Safariでは requestFullscreen が使えない場合があるため、
   使えない場合は操作パネルを隠して疑似全画面にする */
async function maximize(){
  if(document.fullscreenEnabled){
    try{
      if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
      return;
    }catch(e){}
  }
  hideUi();
}
fullBtn.onclick=maximize;

function hideUi(){
  controls.classList.add('hidden');
  topBar.classList.add('hidden');
  miniControls.style.display='flex';
}
function showUi(){
  controls.classList.remove('hidden');
  topBar.classList.remove('hidden');
  miniControls.style.display='none';
}
uiToggle.onclick=hideUi;
showUiBtn.onclick=showUi;

/* ピンチズーム・1本指ドラッグ */
let pointers=new Map(),lastDist=0,dragStart=null;
stage.addEventListener('pointerdown',e=>{
  if(e.target===dividerHit||dividerHit.contains(e.target))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1)dragStart={x:e.clientX-panX,y:e.clientY-panY};
});
stage.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId)||draggingDivider)return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1&&dragStart){
    panX=e.clientX-dragStart.x;panY=e.clientY-dragStart.y;draw();
  }else if(pointers.size===2){
    const p=[...pointers.values()];
    const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(lastDist)userScale=Math.max(.25,Math.min(8,userScale*(d/lastDist)));
    lastDist=d;draw();
  }
});
['pointerup','pointercancel'].forEach(ev=>stage.addEventListener(ev,e=>{
  pointers.delete(e.pointerId);
  if(pointers.size<2)lastDist=0;
  if(!pointers.size)dragStart=null;
}));
stage.addEventListener('dblclick',()=>{
  dividerPct=50;userScale=1;panX=0;panY=0;draw();
});
window.addEventListener('resize',()=>setTimeout(draw,60));
window.visualViewport?.addEventListener('resize',()=>setTimeout(draw,60));

function imageToMat(img){
  const c=document.createElement('canvas');
  c.width=img.naturalWidth;c.height=img.naturalHeight;
  c.getContext('2d').drawImage(img,0,0);
  return cv.imread(c);
}

async function autoAlign(){
  if(!cvReady||!imgA||!imgB)return;
  alignBtn.disabled=true;status('自動位置合わせ中…');
  await new Promise(r=>setTimeout(r,40));

  let srcA,srcB,gA,gB,kpA,kpB,desA,desB,mask,orb,matcher,matches,srcPts,dstPts,H,warped;
  try{
    srcA=imageToMat(imgA);srcB=imageToMat(imgB);

    const maxSide=1200;
    const sA=Math.min(1,maxSide/Math.max(srcA.cols,srcA.rows));
    const sB=Math.min(1,maxSide/Math.max(srcB.cols,srcB.rows));
    const smallA=new cv.Mat(),smallB=new cv.Mat();
    cv.resize(srcA,smallA,new cv.Size(0,0),sA,sA,cv.INTER_AREA);
    cv.resize(srcB,smallB,new cv.Size(0,0),sB,sB,cv.INTER_AREA);

    gA=new cv.Mat();gB=new cv.Mat();
    cv.cvtColor(smallA,gA,cv.COLOR_RGBA2GRAY);
    cv.cvtColor(smallB,gB,cv.COLOR_RGBA2GRAY);

    kpA=new cv.KeyPointVector();kpB=new cv.KeyPointVector();
    desA=new cv.Mat();desB=new cv.Mat();mask=new cv.Mat();
    orb=new cv.ORB(2200);
    orb.detectAndCompute(gA,mask,kpA,desA);
    orb.detectAndCompute(gB,mask,kpB,desB);
    if(desA.empty()||desB.empty())throw new Error('features');

    matcher=new cv.BFMatcher(cv.NORM_HAMMING,false);
    matches=new cv.DMatchVectorVector();
    matcher.knnMatch(desB,desA,matches,2);

    const good=[];
    for(let i=0;i<matches.size();i++){
      const m=matches.get(i);
      if(m.size()>=2){
        const m0=m.get(0),m1=m.get(1);
        if(m0.distance<0.74*m1.distance)good.push(m0);
      }
      m.delete();
    }
    if(good.length<8)throw new Error('few');

    const sp=[],dp=[];
    for(const m of good){
      const b=kpB.get(m.queryIdx).pt;
      const a=kpA.get(m.trainIdx).pt;
      sp.push(b.x/sB,b.y/sB);
      dp.push(a.x/sA,a.y/sA);
    }
    srcPts=cv.matFromArray(good.length,1,cv.CV_32FC2,sp);
    dstPts=cv.matFromArray(good.length,1,cv.CV_32FC2,dp);
    const inliers=new cv.Mat();
    H=cv.findHomography(srcPts,dstPts,cv.RANSAC,4,inliers);
    if(H.empty())throw new Error('H');

    warped=new cv.Mat();
    cv.warpPerspective(srcB,warped,H,new cv.Size(srcA.cols,srcA.rows),cv.INTER_LINEAR,cv.BORDER_CONSTANT,new cv.Scalar(0,0,0,0));

    const out=document.createElement('canvas');
    out.width=warped.cols;out.height=warped.rows;
    cv.imshow(out,warped);
    alignedBData=out.getContext('2d').getImageData(0,0,out.width,out.height);

    smallA.delete();smallB.delete();inliers.delete();
    status(`自動合致完了・一致点 ${good.length}`);
    draw();
  }catch(err){
    alignedBData=null;draw();
    status('自動合致できませんでした。構図差が大きい可能性があります');
  }finally{
    for(const x of [srcA,srcB,gA,gB,kpA,kpB,desA,desB,mask,orb,matcher,matches,srcPts,dstPts,H,warped]){
      try{if(x&&x.delete)x.delete()}catch(e){}
    }
    controlsReady();
  }
}
alignBtn.onclick=autoAlign;

window.Module={
  onRuntimeInitialized(){
    cvReady=true;
    status(imgA&&imgB?'準備完了・自動合致できます':'準備完了');
    if(imgA&&imgB)autoAlign();
  }
};
</script>
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
</body>
</html>
